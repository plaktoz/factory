name: chore
type: chore
sink: pull_request
policy:
  write: true
  deny_paths: [".github/**"]
defaults:
  retries: 2
  timeout_minutes: 30
  checkpoint_every_minutes: 10
  max_restarts: 3
stages:
  - id: implement
    tasks:
      - {id: change, skill: implement, scope: ["**"], helpers: {mode: off}, out: change.json}
    gate: [{check: scope-diff}, {check: lint-clean}]
    on_fail: {goto: implement, max: 2}
  - id: verify
    needs: [implement]
    tasks:
      - {id: check, cmd: [scripts/check], out: check.log}
    on_fail: {goto: implement, max: 2}
