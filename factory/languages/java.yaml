name: java
detect: {any_file: [pom.xml, build.gradle, build.gradle.kts]}
files: ["**/*.java"]
practices: own:practices/java
variants:
  maven:
    when: {file: pom.xml}
    format:       [mvn, -q, spotless:apply]
    format_check: [mvn, -q, spotless:check]
    lint:         [mvn, -q, checkstyle:check]
    # Maven reaches Maven Central only (owner decision, 2026-11-25). Under srt the step may reach that one host, and
    # nothing else: this step's `network` key is the only allowance a Java command gets (module 9, module 17A).
    network:
      test: [repo.maven.apache.org]
    # A JUnit report, because the engine's test-report gate reads JUnit only (module 5). Surefire's `reportsDirectory`
    # has no -D property (checked on surefire 3.2.5), so mvn writes TEST-*.xml under target/surefire-reports and python3
    # merges each report this run wrote (newer than the run's start, so a stale report is never counted) into one
    # FACTORY_TASK_DIR/test.junit.xml, the file the engine waits for (module 9). mvn keeps its exit code; the merge runs
    # on failure too. A build that writes no report leaves no file, so the task is not done.
    test:
      - python3
      - -c
      - |
        import os, subprocess, sys, time, urllib.parse
        import xml.etree.ElementTree as ET
        d = os.environ.get("FACTORY_TASK_DIR")
        if not d:
            sys.stderr.write("FACTORY_TASK_DIR is not set\n")
            sys.exit(2)
        # Under srt, Maven's resolver ignores the JVM proxy properties srt's agent sets (measured 2026-11-25), so the
        # proxy from HTTPS_PROXY goes into a settings file in the task folder. Outside srt there is no proxy and no file.
        cmd = ['mvn', '-q', 'test']
        proxy = os.environ.get('HTTPS_PROXY')
        if proxy:
            try:
                u = urllib.parse.urlsplit(proxy)
                host, port = u.hostname, u.port
            except ValueError:
                host, port = None, None
            if not host or port is None:
                sys.stderr.write("HTTPS_PROXY must be a URL with a host and a port\n")
                sys.exit(2)
            user, pw = urllib.parse.unquote(u.username or ''), urllib.parse.unquote(u.password or '')
            path = os.path.join(d, 'maven-proxy-settings.xml')
            fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
            with os.fdopen(fd, 'w') as f:
                f.write('<settings><proxies><proxy><id>srt</id><active>true</active><protocol>https</protocol>'
                        '<host>%s</host><port>%s</port><username>%s</username><password>%s</password>'
                        '<nonProxyHosts>localhost|127.0.0.1</nonProxyHosts></proxy></proxies></settings>'
                        % (u.hostname, u.port, user, pw))
            cmd = ['mvn', '-q', '-s', path, 'test']
        start = time.time()
        try:
            rc = subprocess.call(cmd)
        except FileNotFoundError:
            sys.stderr.write("mvn: command not found\n")
            sys.exit(127)
        finally:
            # The file holds srt's proxy password, so it is removed when mvn ends, on success or failure.
            if proxy:
                os.remove(path)
        suites = []
        for root, dirs, files in os.walk("."):
            dirs[:] = [x for x in dirs if x not in (".git", "node_modules")]
            if os.path.basename(root) != "surefire-reports":
                continue
            for f in files:
                src = os.path.join(root, f)
                if f.startswith("TEST-") and f.endswith(".xml") and os.path.getmtime(src) >= start:
                    suites.append(ET.parse(src).getroot())
        if suites:
            merged = ET.Element("testsuites")
            for s in suites:
                merged.append(s)
            ET.ElementTree(merged).write(os.path.join(d, "test.junit.xml"), encoding="utf-8", xml_declaration=True)
        sys.exit(rc)
    build:        [mvn, -q, -DskipTests, package]
    tools: [mvn]
  gradle:
    when: {any_file: [build.gradle, build.gradle.kts]}
    format:       [gradlew, spotlessApply]
    format_check: [gradlew, spotlessCheck]
    lint:         [gradlew, checkstyleMain]
    # A JUnit report, as the Maven step (module 17A). Gradle writes TEST-*.xml under build/test-results/test (Gradle 9.9.2,
    # a temp project, 2026-11-26). `cleanTest` forces the run: an up-to-date `test` task writes no new report. The
    # reports this run wrote are copied into FACTORY_TASK_DIR/test.junit.xml, the file the engine waits for (module 9).
    # gradlew keeps its exit code, and the copy runs on failure too. Gradle's user home is FACTORY_TASK_DIR/cache/gradle
    # unless GRADLE_USER_HOME is set: under srt only the worktree and the task folder are writable (module 9).
    test:
      - python3
      - -c
      - |
        import os, subprocess, sys, time
        import xml.etree.ElementTree as ET
        d = os.environ.get("FACTORY_TASK_DIR")
        if not d:
            sys.stderr.write("FACTORY_TASK_DIR is not set\n")
            sys.exit(2)
        env = dict(os.environ)
        env.setdefault("GRADLE_USER_HOME", os.path.join(d, "cache", "gradle"))
        # Under srt the macOS `java` stub finds no runtime (measured 2026-11-26), so a JAVA_HOME that is not set gets the
        # Homebrew JDK, as Homebrew's own gradle and mvn scripts use it. A set JAVA_HOME is kept.
        env.setdefault("JAVA_HOME", "/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home")
        start = time.time()
        try:
            rc = subprocess.call(["./gradlew", "--no-daemon", "cleanTest", "test"], env=env)
        except FileNotFoundError:
            sys.stderr.write("gradlew: command not found\n")
            sys.exit(127)
        suites = []
        for root, dirs, files in os.walk("."):
            dirs[:] = [x for x in dirs if x not in (".git", "node_modules")]
            if os.path.basename(root) != "test" or os.path.basename(os.path.dirname(root)) != "test-results":
                continue
            for f in files:
                src = os.path.join(root, f)
                if f.startswith("TEST-") and f.endswith(".xml") and os.path.getmtime(src) >= start:
                    suites.append(ET.parse(src).getroot())
        if suites:
            merged = ET.Element("testsuites")
            for s in suites:
                merged.append(s)
            ET.ElementTree(merged).write(os.path.join(d, "test.junit.xml"), encoding="utf-8", xml_declaration=True)
        sys.exit(rc)
    # The hosts the Gradle test step reaches under srt (2026-11-26, Gradle 9.9.2, temp JUnit 5 project). Each is needed:
    # services.gradle.org serves the wrapper distribution, which redirects to github.com, then to
    # release-assets.githubusercontent.com; repo.maven.apache.org serves JUnit. Removing each in turn fails with
    # `host is not on the allow list` (or `Could not resolve junit`). These hosts are NOT sufficient on their own: with
    # them the step still fails under srt at Gradle's lock service (`SocketException: Operation not permitted`), which
    # needs srt's allowLocalBinding, a sandbox-wide grant no profile key can name. The step is not srt-verified until
    # the owner decides that (module 17A, Gradle row).
    network:
      test: [services.gradle.org, github.com, release-assets.githubusercontent.com, repo.maven.apache.org]
    build:        [gradlew, assemble]
    tools: [gradlew]
