<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Run state while a pull request is open</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1c1a;--mute:#666660;--line:#dcdcd6;--accent:#2b5fd9;--accent-bg:#e8eefc;--pro:#1b7a3e;--con:#b3261e;--rec:#8a5a00;--rec-bg:#fdf1d6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ececE8;--mute:#9a9a92;--line:#34342f;--accent:#7ca3ff;--accent-bg:#1e2a4a;--pro:#5fcf8a;--con:#ff8a80;--rec:#f2c260;--rec-bg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 2px}
.tag{font-size:12px;color:var(--mute);margin:0 0 10px}
.ctx{margin:0 0 12px}
.ctx b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.opts{display:grid;gap:8px}
label.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
label.opt input{margin-right:8px}
.name{font-weight:600}
.rec{font-size:11px;font-weight:600;color:var(--rec);background:var(--rec-bg);border-radius:4px;padding:1px 6px;margin-left:6px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 0 24px;font-size:13px}
@media(max-width:560px){.pc{grid-template-columns:1fr;margin-left:0}}
.pc ul{margin:0;padding-left:16px}
.pro li::marker{color:var(--pro)} .con li::marker{color:var(--con)}
.why{font-size:13px;color:var(--mute);margin:10px 0 0}
textarea{width:100%;min-height:54px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
.q{font-size:16px;font-weight:600;margin:0 0 10px}
.ta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
@media(max-width:560px){.ta{grid-template-columns:1fr}}
.ta div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.ta b,.pv b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.pv{margin:0 0 12px}
.pv pre{margin:0;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.see{display:block;margin:4px 0 0 24px}
.asks{display:block;margin:2px 0 0 24px;font-size:13px;color:var(--mute)}
details.how{margin:6px 0 0 24px;font-size:13px;color:var(--mute)}
details.how summary{cursor:pointer;color:var(--accent)}
@media(max-width:560px){.see,.asks,details.how{margin-left:0}}
#out{display:none;margin-top:24px}
#out textarea{min-height:320px;font:13px/1.45 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<main>
<h1 id="h1"></h1>
<p class="sub" id="intro"></p>
<div id="list"></div>
<section id="out" class="card">
  <h2>Prompt</h2>
  <p class="tag">Copy this and paste it into the Claude Code session.</p>
  <textarea id="prompt" readonly></textarea>
</section>
</main>
<div class="bar">
  <span id="count"></span>
  <button id="gen">Generate prompt</button>
  <button id="copy" class="alt">Copy</button>
  <button id="reset" class="alt">Reset to recommended</button>
</div>
<script id="data" type="application/json">{"title": "Run state while a pull request is open", "intro": "Already fixed: the pull request is opened; nothing checks it afterwards. Asked: what a run should show while its pull request waits.", "target": "docs/adr/2026-11-20-run-state-while-the-pull-request-is-open.md", "storage_key": "run-state-pr-open-2026-11-20", "decisions": [{"id": "D1", "title": "Run state while the pull request is open", "ref": "Engine finish step and tick (ADR 2026-11-20-run-state-while-the-pull-request-is-open)", "question": "While a run's pull request is open, should the run say it is waiting for review until GitHub merges it?", "today": "Today the run is marked done in the same step that opens the pull request. Nothing checks that pull request afterwards, so a red check or a merge never changes the run.", "after": "With the recommended option, the run shows as waiting for review after its pull request opens. It turns done only after GitHub merges the pull request. A red check sends the run back to the fix stage with the failing output.", "preview": "Today:\n  run fix-login   status: done\n  pull request #123 is open. Nothing watches it.\n\nAfter:\n  run fix-login   status: awaiting_approval\n  Pull request #123 waits for review: https://github.com/example/repo/pull/123", "options": [{"id": "merge-review-stop", "name": "Wait for review until merged", "recommended": true, "see": "After the pull request opens, the run shows as waiting for review. It turns done only after the pull request merges. A red check sends the run back to fix, with the failing output.", "asks": "Nothing new. Merge or close the pull request on GitHub, as you do today.", "how": "The run waits at a review stop. A background pass checks the pull request and starts the run when its state changes. Only the run's own process changes its status.", "pros": ["Matches the spec's status table and its merge review stop, so no spec change is needed", "Every status change stays in the process that holds the run's lock"], "cons": ["A run whose work is finished shows waiting, not done, until the merge", "Needs a new case for a review stop that has no decision file, in the run's code and in the background pass"]}, {"id": "done-at-pr-open", "name": "Done when the pull request opens", "recommended": false, "see": "The run shows done as soon as its pull request opens, as it does today. If a later check goes red, the run reopens and goes back to fix.", "asks": "Nothing new.", "how": "Keep the status as it is now. A background pass looks at done runs that still have an open pull request, and reopens one whose checks turn red.", "pros": ["Smallest change: the run's status stays as it is today", "The dashboard keeps showing done for finished work"], "cons": ["Done stops meaning finished, and it departs from the spec's status table", "Housekeeping treats done as finished (housekeeping.py:28), so cleanup could take a run whose pull request is still open", "Reopening a run is a status change from outside its lock holder, or a second route to the same change"]}, {"id": "tick-acts", "name": "Background pass changes the run", "recommended": false, "see": "The run shows done as today. A separate background pass watches its pull request and sends red checks back to fix, without the run's own process.", "asks": "Nothing new.", "how": "The background pass changes the run's status and starts its fix stage, instead of the run's own process doing it.", "pros": ["No change to the run's process or its status table"], "cons": ["Breaks the rule that only the process holding a run's lock writes its status", "Two places decide what a red check means: the background pass and the run's own rework rules"]}], "why": "It is the state the spec already describes, and it keeps every status change inside the process that holds the run's lock."}]}</script>
<script>
const P=JSON.parse(document.getElementById("data").textContent), D=P.decisions;
const KEY="decision-page:"+P.storage_key;
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function recOf(d){return d.options.find(o=>o.recommended).id}
document.getElementById("h1").textContent=P.title;
document.getElementById("intro").innerHTML=esc(P.intro)+" Spec: <code>"+esc(P.target)+"</code>. Recommended options are preselected. Pick one per card, add a question if you are unsure, then press <b>Generate prompt</b> and paste it back into Claude Code.";
const list=document.getElementById("list");
D.forEach(d=>{
  const cur=(state[d.id]&&state[d.id].choice)||recOf(d);
  const el=document.createElement("section");el.className="card";
  el.innerHTML=
   `<h2>${esc(d.id)}. ${esc(d.title)}</h2><p class="tag">${esc(d.ref)}</p>`+
   (d.today ? (d.question?`<p class="q">${esc(d.question)}</p>`:"")+
     `<div class="ta"><div><b>Today</b>${esc(d.today)}</div><div><b>After the recommended option</b>${esc(d.after)}</div></div>`+
     `<div class="pv"><b>What it looks like</b><pre>${esc(d.preview)}</pre></div>`
   : `<div class="ctx"><b>Context</b>${esc(d.context)}</div>`)+
   `<div class="opts">`+d.options.map(o=>
     `<label class="opt"><input type="radio" name="${esc(d.id)}" value="${esc(o.id)}" ${o.id===cur?"checked":""}>`+
     `<span class="name">${esc(o.name)}</span>${o.recommended?'<span class="rec">Recommended</span>':""}`+
     (o.see?`<span class="see">What you'll see: ${esc(o.see)}</span>`:"")+
     (o.asks?`<span class="asks">Asks of you: ${esc(o.asks)}</span>`:"")+
     `<div class="pc"><ul class="pro">${o.pros.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul><ul class="con">${o.cons.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>`+
     (o.how?`<details class="how"><summary>How it works</summary>${esc(o.how)}</details>`:"")+`</label>`).join("")+
   `<label class="opt"><input type="radio" name="${esc(d.id)}" value="unsure" ${cur==="unsure"?"checked":""}><span class="name">Not sure: I have a question</span></label></div>`+
   `<p class="why">Why recommended: ${esc(d.why)}</p>`+
   `<textarea data-q="${esc(d.id)}" placeholder="Question or note (optional)">${esc((state[d.id]&&state[d.id].note)||"")}</textarea>`;
  list.appendChild(el);
});
list.addEventListener("input",e=>{
  const t=e.target;
  if(t.type==="radio"){state[t.name]=Object.assign(state[t.name]||{},{choice:t.value})}
  else if(t.dataset.q){state[t.dataset.q]=Object.assign(state[t.dataset.q]||{},{note:t.value})}
  save();
});
function build(){
  const lines=["Decisions on "+P.target+" (from the decision page \""+P.title+"\").","Apply each choice, update everything it touches, and keep related sections consistent. Where I asked a question, answer it and wait for me before applying that item.",""];
  let unsure=0;
  D.forEach(d=>{
    const s=state[d.id]||{};const ch=s.choice||recOf(d);const note=(s.note||"").trim();
    if(ch==="unsure"){unsure++;lines.push(`${d.id} ${d.title}: NOT SURE.`+(note?` Question: ${note}`:" (no question written)"))}
    else{const o=d.options.find(x=>x.id===ch);
      lines.push(`${d.id} ${d.title}: ${o.name} [${o.id}]`+(o.recommended?" (recommended)":" (not the recommendation)")+(note?`. Note: ${note}`:""))}
  });
  document.getElementById("count").textContent=`${D.length} decisions, ${unsure} unsure`;
  return lines.join("\n");
}
const out=document.getElementById("out"),ta=document.getElementById("prompt");
document.getElementById("gen").onclick=()=>{ta.value=build();out.style.display="block";out.scrollIntoView({behavior:"smooth"})};
document.getElementById("copy").onclick=async()=>{
  ta.value=build();out.style.display="block";
  try{await navigator.clipboard.writeText(ta.value);flash("Copied")}catch(e){ta.select();flash(document.execCommand&&document.execCommand("copy")?"Copied":"Select and copy")}
};
document.getElementById("reset").onclick=()=>{state={};save();location.reload()};
function flash(m){const b=document.getElementById("copy");const t=b.textContent;b.textContent=m;setTimeout(()=>b.textContent=t,1200)}
document.getElementById("count").textContent=`${D.length} decisions`;
</script>
</body>
</html>
