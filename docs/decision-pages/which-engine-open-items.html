<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Which engine: open items</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1c1a;--mute:#666660;--line:#dcdcd6;--accent:#2b5fd9;--accent-bg:#e8eefc;--pro:#1b7a3e;--con:#b3261e;--rec:#8a5a00;--rec-bg:#fdf1d6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ececE8;--mute:#9a9a92;--line:#34342f;--accent:#7ca3ff;--accent-bg:#1e2a4a;--pro:#5fcf8a;--con:#ff8a80;--rec:#f2c260;--rec-bg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 2px}
.tag{font-size:12px;color:var(--mute);margin:0 0 10px}
.ctx{margin:0 0 12px}
.ctx b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.opts{display:grid;gap:8px}
label.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
label.opt input{margin-right:8px}
.name{font-weight:600}
.rec{font-size:11px;font-weight:600;color:var(--rec);background:var(--rec-bg);border-radius:4px;padding:1px 6px;margin-left:6px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 0 24px;font-size:13px}
@media(max-width:560px){.pc{grid-template-columns:1fr;margin-left:0}}
.pc ul{margin:0;padding-left:16px}
.pro li::marker{color:var(--pro)} .con li::marker{color:var(--con)}
.why{font-size:13px;color:var(--mute);margin:10px 0 0}
textarea{width:100%;min-height:54px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
.q{font-size:16px;font-weight:600;margin:0 0 10px}
.ta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
@media(max-width:560px){.ta{grid-template-columns:1fr}}
.ta div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.ta b,.pv b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.pv{margin:0 0 12px}
.pv pre{margin:0;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.see{display:block;margin:4px 0 0 24px}
.asks{display:block;margin:2px 0 0 24px;font-size:13px;color:var(--mute)}
details.how{margin:6px 0 0 24px;font-size:13px;color:var(--mute)}
details.how summary{cursor:pointer;color:var(--accent)}
@media(max-width:560px){.see,.asks,details.how{margin-left:0}}
#out{display:none;margin-top:24px}
#out textarea{min-height:320px;font:13px/1.45 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<main>
<h1 id="h1"></h1>
<p class="sub" id="intro"></p>
<div id="list"></div>
<section id="out" class="card">
  <h2>Prompt</h2>
  <p class="tag">Copy this and paste it into the Claude Code session.</p>
  <textarea id="prompt" readonly></textarea>
</section>
</main>
<div class="bar">
  <span id="count"></span>
  <button id="gen">Generate prompt</button>
  <button id="copy" class="alt">Copy</button>
  <button id="reset" class="alt">Reset to recommended</button>
</div>
<script id="data" type="application/json">{"title": "Which engine: open items", "intro": "Already fixed: each repo's runs use the engine that came with the repo's own kit, and the launcher picks it by pointing Python at the run's saved copy. Asked: three things that were left open when that was accepted.", "target": "docs/tasks.md", "storage_key": "which-engine-open-items-2026-11-21", "decisions": [{"id": "D1", "title": "Test files in each repo's engine copy", "ref": "Kit copy on init and upgrade (docs/tasks.md, item 17, part a)", "question": "When factory init copies the engine into a repo, should the engine's own test files come along?", "today": "A repo's factory folder holds no engine. I counted what the copy would be if nothing is left out: 128 files and 1.1 MB with the test files, 60 files and 0.6 MB without them (counted in bytes, with caches and the local environment left out).", "after": "With the recommended option, every repo that runs factory init gets the 60 engine files it needs to run, and no tests. The copy in each repo and in each run's saved kit is about half the size.", "preview": "Repo after factory init (recommended)\n  factory/engine/factory_engine/   60 files, 0.6 MB in all\n\nRepo after factory init (tests included)\n  factory/engine/factory_engine/   60 files\n  factory/engine/tests/            68 more files, 0.5 MB", "options": [{"id": "engine-without-tests", "name": "Leave the tests out", "recommended": true, "see": "Each repo's factory folder gets only the files the engine needs to run, 0.6 MB.", "asks": "nothing", "how": "The kit copy skips the engine's tests folder, next to the skips it already has for caches.", "pros": ["About half the size in every repo and in every saved run copy.", "A repo cannot be confused into thinking it should run the factory's own tests."], "cons": ["Nobody can run the engine's tests from inside a target repo; they run in the factory repo only."]}, {"id": "engine-with-tests", "name": "Copy everything", "see": "Each repo's factory folder holds the full engine folder with its tests, 1.1 MB.", "asks": "nothing", "how": "The kit copy skips nothing under the engine folder.", "pros": ["The copy is identical to the factory's own engine folder, so there is one fewer rule to remember."], "cons": ["68 extra files (0.5 MB) in every repo and in every saved run copy.", "Test files are committed into repos that never run them."]}], "why": "The tests are not needed to run a run, and nearly halving what every repo carries costs nothing."}, {"id": "D2", "title": "A run whose saved kit has no engine", "ref": "Launcher dispatch (docs/tasks.md, item 17, part b)", "question": "If a run was started before this change, so its saved kit has no engine, should the launcher refuse to continue it or quietly use the installed engine?", "today": "Every run uses the installed engine, so this case does not exist yet. I checked this machine: it has no saved kits at all (the folder ~/.factory/kits is missing), so no run here would be affected. A saved kit is never changed after a run starts, so such a run can never gain an engine.", "after": "With the recommended option, the launcher stops and tells you the run's saved kit has no engine, instead of running it on code from a different version.", "preview": "$ factory status fix-login\nerror: run fix-login was started on a kit with no engine (kit b2ae469fc5df).\nfix: abort the run and add it again after factory upgrade,\n     or continue it on the installed engine with --installed-engine.", "options": [{"id": "refuse-with-fix", "name": "Stop and say how to fix it", "recommended": true, "see": "The command fails with a message naming the run and two ways out: abort and re-add it, or continue it once on the installed engine by adding an option to the command.", "asks": "On a stuck run, one extra option on the command, or an abort and re-add.", "how": "The launcher checks for the engine folder in the saved kit before it starts anything.", "pros": ["A run never silently changes engine version, which is what saving the kit is for.", "The failure names the fix."], "cons": ["An old run needs one manual step before it moves again.", "Adds one new command option."]}, {"id": "fall-back-with-warning", "name": "Use the installed engine and warn", "see": "The command runs as before on the installed engine and prints a warning that the run is not on its own engine.", "asks": "Reading the warning; nothing else.", "how": "The launcher skips the engine selection for that run and writes the warning to the run's event list.", "pros": ["No old run is ever stuck.", "No new command option."], "cons": ["A run can cross engine versions without anyone choosing it.", "A warning is easy to miss in a tick that runs on its own."]}], "why": "No run here is affected today, so the strict rule costs nothing now, and the quiet fallback is the exact behavior this decision set out to remove."}, {"id": "D3", "title": "Pushing the branch", "ref": "Branch wave4/m16-criteria (4 commits ahead of the local copy of main)", "question": "Should I push wave4/m16-criteria and open a pull request now, or keep it on this machine until the engine change is built?", "today": "The branch has no copy on GitHub that this machine knows of, and it is 4 commits ahead of the local copy of main (I did not fetch, so GitHub may have moved on). Two commits are the earlier work: the merge-review poll and the new watch command, with their tests (11 code files). Two are today's: the accepted decision, the spec notes, the task and the page files. None of it builds the two-engine change yet.", "after": "With the first option, GitHub gets one pull request with the earlier work and the decision together. The decision then sits on main, and the engine change follows as the next pull request.", "preview": "Pull request (push now)\n  4 commits, 26 files\n    earlier work: merge-review poll, factory watch, tests (11 code files)\n    today: accepted decision, spec notes, task, page files\n  The two-engine criterion stays open.", "options": [{"id": "push-docs-now", "name": "Push and open one pull request now", "recommended": true, "see": "One pull request appears on GitHub with the earlier work and the decision, 4 commits in all.", "asks": "Reviewing a pull request that mixes the earlier code with the docs.", "how": "git push, then gh pr create against main. No fetch or merge is run.", "pros": ["The decision reaches main before anyone builds on it.", "Nothing is held back that is already tested."], "cons": ["The pull request is larger than a docs-only one: 26 files, 11 of them code.", "The branch may need bringing up to date by whoever merges it, since I have not fetched."]}, {"id": "hold-until-built", "name": "Wait and push with the build", "see": "Nothing appears on GitHub yet. One larger pull request follows once the engine change and its test exist.", "asks": "Waiting; the decision stays off main until then.", "how": "The branch stays local; the build is added to it.", "pros": ["One pull request holds the decision and the build that proves it."], "cons": ["Anyone reading main sees the question as unanswered.", "A larger pull request is slower to review."]}, {"id": "keep-local", "name": "Do not push yet", "see": "Nothing is sent anywhere, and you tell me when.", "asks": "Telling me when to push.", "how": "No change.", "pros": ["You keep full control of when this is public."], "cons": ["The branch exists on one machine only until you say."]}], "why": "The earlier work is already tested and the decision is written, so there is no reason to hold either back."}]}</script>
<script>
const P=JSON.parse(document.getElementById("data").textContent), D=P.decisions;
const KEY="decision-page:"+P.storage_key;
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function recOf(d){return d.options.find(o=>o.recommended).id}
document.getElementById("h1").textContent=P.title;
document.getElementById("intro").innerHTML=esc(P.intro)+" Spec: <code>"+esc(P.target)+"</code>. Recommended options are preselected. Pick one per card, add a question if you are unsure, then press <b>Generate prompt</b> and paste it back into Claude Code.";
const list=document.getElementById("list");
D.forEach(d=>{
  const cur=(state[d.id]&&state[d.id].choice)||recOf(d);
  const el=document.createElement("section");el.className="card";
  el.innerHTML=
   `<h2>${esc(d.id)}. ${esc(d.title)}</h2><p class="tag">${esc(d.ref)}</p>`+
   (d.today ? (d.question?`<p class="q">${esc(d.question)}</p>`:"")+
     `<div class="ta"><div><b>Today</b>${esc(d.today)}</div><div><b>After the recommended option</b>${esc(d.after)}</div></div>`+
     `<div class="pv"><b>What it looks like</b><pre>${esc(d.preview)}</pre></div>`
   : `<div class="ctx"><b>Context</b>${esc(d.context)}</div>`)+
   `<div class="opts">`+d.options.map(o=>
     `<label class="opt"><input type="radio" name="${esc(d.id)}" value="${esc(o.id)}" ${o.id===cur?"checked":""}>`+
     `<span class="name">${esc(o.name)}</span>${o.recommended?'<span class="rec">Recommended</span>':""}`+
     (o.see?`<span class="see">What you'll see: ${esc(o.see)}</span>`:"")+
     (o.asks?`<span class="asks">Asks of you: ${esc(o.asks)}</span>`:"")+
     `<div class="pc"><ul class="pro">${o.pros.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul><ul class="con">${o.cons.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>`+
     (o.how?`<details class="how"><summary>How it works</summary>${esc(o.how)}</details>`:"")+`</label>`).join("")+
   `<label class="opt"><input type="radio" name="${esc(d.id)}" value="unsure" ${cur==="unsure"?"checked":""}><span class="name">Not sure: I have a question</span></label></div>`+
   `<p class="why">Why recommended: ${esc(d.why)}</p>`+
   `<textarea data-q="${esc(d.id)}" placeholder="Question or note (optional)">${esc((state[d.id]&&state[d.id].note)||"")}</textarea>`;
  list.appendChild(el);
});
list.addEventListener("input",e=>{
  const t=e.target;
  if(t.type==="radio"){state[t.name]=Object.assign(state[t.name]||{},{choice:t.value})}
  else if(t.dataset.q){state[t.dataset.q]=Object.assign(state[t.dataset.q]||{},{note:t.value})}
  save();
});
function build(){
  const lines=["Decisions on "+P.target+" (from the decision page \""+P.title+"\").","Apply each choice, update everything it touches, and keep related sections consistent. Where I asked a question, answer it and wait for me before applying that item.",""];
  let unsure=0;
  D.forEach(d=>{
    const s=state[d.id]||{};const ch=s.choice||recOf(d);const note=(s.note||"").trim();
    if(ch==="unsure"){unsure++;lines.push(`${d.id} ${d.title}: NOT SURE.`+(note?` Question: ${note}`:" (no question written)"))}
    else{const o=d.options.find(x=>x.id===ch);
      lines.push(`${d.id} ${d.title}: ${o.name} [${o.id}]`+(o.recommended?" (recommended)":" (not the recommendation)")+(note?`. Note: ${note}`:""))}
  });
  document.getElementById("count").textContent=`${D.length} decisions, ${unsure} unsure`;
  return lines.join("\n");
}
const out=document.getElementById("out"),ta=document.getElementById("prompt");
document.getElementById("gen").onclick=()=>{ta.value=build();out.style.display="block";out.scrollIntoView({behavior:"smooth"})};
document.getElementById("copy").onclick=async()=>{
  ta.value=build();out.style.display="block";
  try{await navigator.clipboard.writeText(ta.value);flash("Copied")}catch(e){ta.select();flash(document.execCommand&&document.execCommand("copy")?"Copied":"Select and copy")}
};
document.getElementById("reset").onclick=()=>{state={};save();location.reload()};
function flash(m){const b=document.getElementById("copy");const t=b.textContent;b.textContent=m;setTimeout(()=>b.textContent=t,1200)}
document.getElementById("count").textContent=`${D.length} decisions`;
</script>
</body>
</html>
