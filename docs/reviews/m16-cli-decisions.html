<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Module 16: the decide command form and the end-to-end test workflow</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1c1a;--mute:#666660;--line:#dcdcd6;--accent:#2b5fd9;--accent-bg:#e8eefc;--pro:#1b7a3e;--con:#b3261e;--rec:#8a5a00;--rec-bg:#fdf1d6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ececE8;--mute:#9a9a92;--line:#34342f;--accent:#7ca3ff;--accent-bg:#1e2a4a;--pro:#5fcf8a;--con:#ff8a80;--rec:#f2c260;--rec-bg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 2px}
.tag{font-size:12px;color:var(--mute);margin:0 0 10px}
.ctx{margin:0 0 12px}
.ctx b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.opts{display:grid;gap:8px}
label.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
label.opt input{margin-right:8px}
.name{font-weight:600}
.rec{font-size:11px;font-weight:600;color:var(--rec);background:var(--rec-bg);border-radius:4px;padding:1px 6px;margin-left:6px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 0 24px;font-size:13px}
@media(max-width:560px){.pc{grid-template-columns:1fr;margin-left:0}}
.pc ul{margin:0;padding-left:16px}
.pro li::marker{color:var(--pro)} .con li::marker{color:var(--con)}
.why{font-size:13px;color:var(--mute);margin:10px 0 0}
textarea{width:100%;min-height:54px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
#out{display:none;margin-top:24px}
#out textarea{min-height:320px;font:13px/1.45 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<main>
<h1 id="h1"></h1>
<p class="sub" id="intro"></p>
<div id="list"></div>
<section id="out" class="card">
  <h2>Prompt</h2>
  <p class="tag">Copy this and paste it into the Claude Code session.</p>
  <textarea id="prompt" readonly></textarea>
</section>
</main>
<div class="bar">
  <span id="count"></span>
  <button id="gen">Generate prompt</button>
  <button id="copy" class="alt">Copy</button>
  <button id="reset" class="alt">Reset to recommended</button>
</div>
<script id="data" type="application/json">{"title": "Module 16: the decide command form and the end-to-end test workflow", "intro": "The CLI parser (argparse, two entry points) is already decided in ADR 2026-11-16-cli-parser-and-entry-points. Two things the build agent chose where it believed the spec could not be met are asked here.", "target": "docs/design/modules/16-drivers.md", "storage_key": "m16-cli-decisions-v1", "decisions": [{"id": "M1", "title": "How `factory decide` takes the answers", "ref": "Module 16 command table and Run commands in detail; module 11, Answer a stop; router skill; dashboard `_build_command`", "context": "`factory decide` records a person's answer to a human stop. The CLI, the router skill and the dashboard's Submit button all call it, so its argument form is shared by three callers. The spec writes the answers as trailing tokens (`decide \u003crun> --packet 661cb74d D1=opt-a D2=opt-b --notes \"...\"`). The agent built a repeatable `--choice D1=opt-a` instead, because it believed argparse cannot take a variable positional list between options. Checked: with a plain positional list, argparse fails on Python 3.10.22 and 3.13.0 when the answers follow an option (`unrecognized arguments`), and `parse_intermixed_args` raises `TypeError` on 3.10 and 3.15. With `parse_known_args` and a check that every extra token looks like `ID=option`, the spec's form parses on 3.10.22 and 3.15.0 with the answers before, between or after the options. The dashboard (`launcher/server/app.py`, tested in `test_pages_and_writes.py`) already sends the positional form, and the built CLI rejects that argv: exit 2, code `cli.usage`.", "options": [{"id": "positional-per-spec", "name": "Build the spec's positional form with `parse_known_args`, and drop `--choice`", "recommended": true, "pros": ["Matches the spec, module 11's example, the dashboard and its tests, so nothing else changes.", "Fixes the dashboard Submit, which the built CLI rejects today.", "One form to document and to teach in the router skill.", "Checked on 3.10.22 and 3.15.0: answers before, between or after `--notes`, `--question` and `--packet` all parse."], "cons": ["The CLI checks the extra tokens itself, so a typo such as `oops` is reported by our code with its own message, not by argparse.", "The ADR's For line says positionals are plain argparse. That holds only with this workaround, and the ADR stays as written because another author wrote it.", "A small change to `cli.py` plus a test for each option order."]}, {"id": "choice-flag-amend-spec", "name": "Keep `--choice D1=opt-a`, and change the spec, module 11, the router skill and the dashboard to match", "recommended": false, "pros": ["Plain argparse: help text lists the flag and argparse reports every usage error.", "No workaround code in the parser.", "The flag is explicit, so a decision id can never be mistaken for a run id."], "cons": ["Edits the spec, module 11's example, the router skill and `launcher/server/app.py` with its tests, which is more files than option one.", "Reverses a contract two finished modules (11, 15) already rely on.", "The reason for it, that argparse cannot do the positional form, is not true on the versions checked."]}, {"id": "both-forms", "name": "Accept both: the spec's positional tokens and `--choice` as an alias", "recommended": false, "pros": ["The dashboard and the spec work unchanged, and the build already written keeps working.", "Scripts that used `--choice` in the last day do not break."], "cons": ["Two ways to do one thing, both to document and to test.", "A call that mixes both forms needs a rule for which wins.", "No caller outside this branch uses `--choice` yet (nothing is pushed), so the alias protects nothing that exists."]}], "why": "The spec, module 11 and the dashboard already agree on the positional form, and it parses on both supported Pythons, so the least change is to meet the spec."}, {"id": "M2", "title": "Which workflow the end-to-end CLI test runs", "ref": "Module 16 \"Run and test\" line; `factory/engine/tests/drivers/test_cli_end_to_end.py`", "context": "The end-to-end test is the only test that drives a whole run through the CLI (`add`, `run`, and later `decide`) with `FakeWorkerAdapter` and `FakePullRequests`, and the spec says it runs the bug-fix workflow. The agent ran `chore` instead, because bug-fix needs a repro script, `make` targets, JUnit reports, a review and a human approval stop at `propose`. Phase 1a ships bug-fix and chore, and the pilot is one chore or bug-fix issue. Checked: `cmd` gates run through a replaceable runner, `gates.use_command_runner` (`gates.py:70`), so a test can stub them; `make`, `npm` and `node` exist on this machine, but the seeded repo has no Makefile or `web/` folder. Not checked: whether `cmd` tasks (`make test-api`) go through that same runner, and how many scripted artifacts bug-fix's schema and check gates need.", "options": [{"id": "bug-fix-stubbed-gates", "name": "Run the shipped bug-fix workflow, with its `cmd` gates stubbed and the worker scripted", "recommended": true, "pros": ["Meets the spec line, and tests the workflow the spec names.", "Bug-fix has the `propose` approval stop, so the test answers it with `factory decide` through the CLI and covers decision M1's command end to end.", "It also drives the `on_fail` routing and the `skip` and `retry` paths only bug-fix has, through the CLI.", "Uses a seam that already exists, so no change to engine code."], "cons": ["The biggest fixture of the three: valid scripted artifacts for each stage (`stage-report`, `test-report`, review findings) and a stub for every `cmd` gate. Effort not measured.", "A stubbed gate proves the engine's routing, not that `scripts/repro-fails.sh` works, which no seeded repo can show.", "If `cmd` tasks do not use the stub seam, the verify stage needs a second one."]}, {"id": "keep-chore", "name": "Keep `chore` as the end-to-end run and change the spec line to say so", "recommended": false, "pros": ["Already built and passing: the chore test and all 33 `tests/drivers` tests passed.", "Chore's gates are met by a seeded repo with no stubs.", "Chore is a phase 1a workflow and a pilot workflow, so it is a real run."], "cons": ["Chore has no human approval stop, so no CLI test answers a stop with `decide` start to finish.", "No CLI-level test of the retry-and-route path through `on_fail goto` on a stage that has a review.", "Changes the spec to match the code, and the module 16 line was written with bug-fix in mind."]}, {"id": "fixture-workflow", "name": "Add a small test-only workflow shaped like bug-fix (an approval stop, an `on_fail` route, one `cmd` gate)", "recommended": false, "pros": ["Covers the approval stop and `decide` through the CLI with a fraction of bug-fix's fixture.", "Fast and easy to read, and it needs no schema-valid reports."], "cons": ["It is not a shipped workflow, so it does not show bug-fix loads and runs through the CLI.", "The spec line still says bug-fix, so the spec changes anyway.", "A fixture workflow can drift from bug-fix without a failing test."]}], "why": "Only bug-fix has the approval stop, so running it through the CLI is the one test that shows a run stopping, being answered by `factory decide` and finishing."}]}</script>
<script>
const P=JSON.parse(document.getElementById("data").textContent), D=P.decisions;
const KEY="decision-page:"+P.storage_key;
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function recOf(d){return d.options.find(o=>o.recommended).id}
document.getElementById("h1").textContent=P.title;
document.getElementById("intro").innerHTML=esc(P.intro)+" Spec: <code>"+esc(P.target)+"</code>. Recommended options are preselected. Pick one per card, add a question if you are unsure, then press <b>Generate prompt</b> and paste it back into Claude Code.";
const list=document.getElementById("list");
D.forEach(d=>{
  const cur=(state[d.id]&&state[d.id].choice)||recOf(d);
  const el=document.createElement("section");el.className="card";
  el.innerHTML=
   `<h2>${esc(d.id)}. ${esc(d.title)}</h2><p class="tag">${esc(d.ref)}</p>`+
   `<div class="ctx"><b>Context</b>${esc(d.context)}</div>`+
   `<div class="opts">`+d.options.map(o=>
     `<label class="opt"><input type="radio" name="${esc(d.id)}" value="${esc(o.id)}" ${o.id===cur?"checked":""}>`+
     `<span class="name">${esc(o.name)}</span>${o.recommended?'<span class="rec">Recommended</span>':""}`+
     `<div class="pc"><ul class="pro">${o.pros.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul><ul class="con">${o.cons.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div></label>`).join("")+
   `<label class="opt"><input type="radio" name="${esc(d.id)}" value="unsure" ${cur==="unsure"?"checked":""}><span class="name">Not sure: I have a question</span></label></div>`+
   `<p class="why">Why recommended: ${esc(d.why)}</p>`+
   `<textarea data-q="${esc(d.id)}" placeholder="Question or note (optional)">${esc((state[d.id]&&state[d.id].note)||"")}</textarea>`;
  list.appendChild(el);
});
list.addEventListener("input",e=>{
  const t=e.target;
  if(t.type==="radio"){state[t.name]=Object.assign(state[t.name]||{},{choice:t.value})}
  else if(t.dataset.q){state[t.dataset.q]=Object.assign(state[t.dataset.q]||{},{note:t.value})}
  save();
});
function build(){
  const lines=["Decisions on "+P.target+" (from the decision page \""+P.title+"\").","Apply each choice, update everything it touches, and keep related sections consistent. Where I asked a question, answer it and wait for me before applying that item.",""];
  let unsure=0;
  D.forEach(d=>{
    const s=state[d.id]||{};const ch=s.choice||recOf(d);const note=(s.note||"").trim();
    if(ch==="unsure"){unsure++;lines.push(`${d.id} ${d.title}: NOT SURE.`+(note?` Question: ${note}`:" (no question written)"))}
    else{const o=d.options.find(x=>x.id===ch);
      lines.push(`${d.id} ${d.title}: ${o.name} [${o.id}]`+(o.recommended?" (recommended)":" (not the recommendation)")+(note?`. Note: ${note}`:""))}
  });
  document.getElementById("count").textContent=`${D.length} decisions, ${unsure} unsure`;
  return lines.join("\n");
}
const out=document.getElementById("out"),ta=document.getElementById("prompt");
document.getElementById("gen").onclick=()=>{ta.value=build();out.style.display="block";out.scrollIntoView({behavior:"smooth"})};
document.getElementById("copy").onclick=async()=>{
  ta.value=build();out.style.display="block";
  try{await navigator.clipboard.writeText(ta.value);flash("Copied")}catch(e){ta.select();flash(document.execCommand&&document.execCommand("copy")?"Copied":"Select and copy")}
};
document.getElementById("reset").onclick=()=>{state={};save();location.reload()};
function flash(m){const b=document.getElementById("copy");const t=b.textContent;b.textContent=m;setTimeout(()=>b.textContent=t,1200)}
document.getElementById("count").textContent=`${D.length} decisions`;
</script>
</body>
</html>
