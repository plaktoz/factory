<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Wave 3 open decisions: commit email and dashboard scope</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1c1a;--mute:#666660;--line:#dcdcd6;--accent:#2b5fd9;--accent-bg:#e8eefc;--pro:#1b7a3e;--con:#b3261e;--rec:#8a5a00;--rec-bg:#fdf1d6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ececE8;--mute:#9a9a92;--line:#34342f;--accent:#7ca3ff;--accent-bg:#1e2a4a;--pro:#5fcf8a;--con:#ff8a80;--rec:#f2c260;--rec-bg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 2px}
.tag{font-size:12px;color:var(--mute);margin:0 0 10px}
.ctx{margin:0 0 12px}
.ctx b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.opts{display:grid;gap:8px}
label.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
label.opt input{margin-right:8px}
.name{font-weight:600}
.rec{font-size:11px;font-weight:600;color:var(--rec);background:var(--rec-bg);border-radius:4px;padding:1px 6px;margin-left:6px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 0 24px;font-size:13px}
@media(max-width:560px){.pc{grid-template-columns:1fr;margin-left:0}}
.pc ul{margin:0;padding-left:16px}
.pro li::marker{color:var(--pro)} .con li::marker{color:var(--con)}
.why{font-size:13px;color:var(--mute);margin:10px 0 0}
textarea{width:100%;min-height:54px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
#out{display:none;margin-top:24px}
#out textarea{min-height:320px;font:13px/1.45 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<main>
<h1 id="h1"></h1>
<p class="sub" id="intro"></p>
<div id="list"></div>
<section id="out" class="card">
  <h2>Prompt</h2>
  <p class="tag">Copy this and paste it into the Claude Code session.</p>
  <textarea id="prompt" readonly></textarea>
</section>
</main>
<div class="bar">
  <span id="count"></span>
  <button id="gen">Generate prompt</button>
  <button id="copy" class="alt">Copy</button>
  <button id="reset" class="alt">Reset to recommended</button>
</div>
<script id="data" type="application/json">{"title": "Wave 3 open decisions: commit email and dashboard scope", "intro": "D1 to D3 of wave 3 are applied and not asked again. PR #43 (Codex adapter, two calls under D7) is on its own page, docs/reviews/pr43-codex-decisions.html; answer it there. Two calls remain here. Module 6B, module 16, the integration tests and the tutorial wait on the 6B pull request from the factory-40 session, not on you, except the dashboard parts of the tutorial (D2 below).", "target": "docs/tasks.md", "storage_key": "wave3-open-decisions-2026-11-15", "decisions": [{"id": "D1", "title": "Your work email in commit 6a6ff04", "ref": "docs/tasks.md item 8 and the 2026-11-14 final-pass log; git history of main", "context": "Commit 6a6ff04 has your work email as its author, and the public GitHub API returns it for that commit. 44 of the 45 pull request heads on GitHub contain the commit, and 73 commits sit after it on main (77 in all). No fork exists. docs/tasks.md also holds the address as text; that text is removed in this same change, with no force push. New commits carry no email at all: 55 commits on main have an empty author email, and this repo's git config sets none. Removing the commit itself needs a force push of main, which you have not approved. GitHub's own guide says a rewrite does not clear its pull request refs, and only GitHub Support can.", "options": [{"id": "keep-history-redact-text", "name": "Keep the history as it is. The text copy in docs/tasks.md is already removed. No force push", "recommended": true, "pros": ["Matches your earlier choice B on authorship: keep current authors, no history rewrite", "No SHA changes, so the 45 remote branches, the 21 local worktrees and open PR #43 stay valid", "Reversible: you can still choose a rewrite later"], "cons": ["The address stays readable on that one commit through the GitHub API and git log, and in every clone made so far", "A rewrite gets dearer as history grows: it already touches 73 commits, and GitHub Support is still needed for the PR refs", "If the address is a risk to you, this option does nothing for it"]}, {"id": "rewrite-and-support", "name": "Rewrite the history to replace the email, force-push every branch, then ask GitHub Support to purge the pull request refs", "pros": ["The only way to remove the address from this repository for good", "Done now, it touches 73 commits, not more"], "cons": ["Needs your approval for force pushes, and breaks the standing rule not to force push", "Every commit after 6a6ff04 gets a new SHA: 73 on main, plus the 45 remote branches and open PR #43, which the other sessions must rebase", "The PR refs keep the old commit until GitHub Support acts, and a PR body can keep the address even then (GitHub's guide)", "git-filter-repo is not installed on this machine, so a tool must be added first"]}, {"id": "new-repository", "name": "Start a clean repository from a squashed copy of main, then delete or make private the old one", "pros": ["No Support request and no force push: the new history never held the address", "Zero forks and zero stars today, so nobody else depends on the old repository"], "cons": ["Loses the 45 pull requests, their review comments and the per-commit history the decision logs cite", "Open PR #43 and every other session's branch must be moved by hand, and the repository URL changes", "The address is gone only if the old repository is deleted or made private, which is your call and not reversible once deleted"]}], "why": "You already chose to keep current authors, the text copy is gone, and a rewrite can still be done later; the cost of waiting is that the address stays on one commit."}, {"id": "D2", "title": "Dashboard in phase 1a: placeholder page or React bundle", "ref": "Module 15; phase-1.md Dashboard rows (phase split and Tech choices); AGENTS.md factory/dashboard; tasks.md item 6", "context": "The spec says React, shipped as a prebuilt bundle. Module 15 merged with a 296-line plain HTML placeholder at factory/dashboard/index.html. It shows Needs you, the runs overview, run detail and Show JSON. It has no usage view, although the server returns usage in run detail. The repo holds no React source (no package.json, no .jsx or .tsx files). The module 15 criteria for the page (refresh, Needs you buttons, run detail paths) are unticked until a UI test runs. The tutorial's dashboard section depends on this.", "options": [{"id": "placeholder-for-1a", "name": "Phase 1a ships the placeholder page, with a usage view added. The React bundle moves to phase 1b", "recommended": true, "pros": ["The pilot needs a read-only page, and the placeholder already does that", "Unblocks the tutorial and the UI tests now, with no new build chain", "Spec change is small: one row in the phase split table and one criterion note"], "cons": ["The spec says React for the dashboard, so phase 1a ships something other than what the spec describes", "UI tests written for the placeholder markup need rewriting when React lands", "Visual design stays plain until 1b"]}, {"id": "build-react-now", "name": "Build the React source and its bundle before phase 1a closes", "pros": ["Matches the spec as written; no spec change", "UI tests are written once, against the real page", "Node 26.13.0 is installed here, so a build is possible"], "cons": ["Starts from nothing: there is no React source in the repo", "Adds a build step and a bundle to the kit, and delays the tutorial", "Spends phase 1a time on UI polish, not on the engine path the pilot proves"]}, {"id": "plain-page-for-good", "name": "Make the plain page the dashboard and drop React from the spec", "pros": ["No build step or Node needed to serve the dashboard", "One page to test, with the UI tests written once", "The spec and the code agree"], "cons": ["Reverses a decision in the phase 1 spec, so it needs a new ADR", "Phase 1b writes (Submit, notes, retry, goto, skip, abort) are harder to build as hand-written markup", "Gives up the designed UI the spec promises"]}], "why": "The pilot is read-only and the engine path matters more; the placeholder covers it now and React can follow in 1b without redoing the server."}]}</script>
<script>
const P=JSON.parse(document.getElementById("data").textContent), D=P.decisions;
const KEY="decision-page:"+P.storage_key;
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function recOf(d){return d.options.find(o=>o.recommended).id}
document.getElementById("h1").textContent=P.title;
document.getElementById("intro").innerHTML=esc(P.intro)+" Spec: <code>"+esc(P.target)+"</code>. Recommended options are preselected. Pick one per card, add a question if you are unsure, then press <b>Generate prompt</b> and paste it back into Claude Code.";
const list=document.getElementById("list");
D.forEach(d=>{
  const cur=(state[d.id]&&state[d.id].choice)||recOf(d);
  const el=document.createElement("section");el.className="card";
  el.innerHTML=
   `<h2>${esc(d.id)}. ${esc(d.title)}</h2><p class="tag">${esc(d.ref)}</p>`+
   `<div class="ctx"><b>Context</b>${esc(d.context)}</div>`+
   `<div class="opts">`+d.options.map(o=>
     `<label class="opt"><input type="radio" name="${esc(d.id)}" value="${esc(o.id)}" ${o.id===cur?"checked":""}>`+
     `<span class="name">${esc(o.name)}</span>${o.recommended?'<span class="rec">Recommended</span>':""}`+
     `<div class="pc"><ul class="pro">${o.pros.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul><ul class="con">${o.cons.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div></label>`).join("")+
   `<label class="opt"><input type="radio" name="${esc(d.id)}" value="unsure" ${cur==="unsure"?"checked":""}><span class="name">Not sure: I have a question</span></label></div>`+
   `<p class="why">Why recommended: ${esc(d.why)}</p>`+
   `<textarea data-q="${esc(d.id)}" placeholder="Question or note (optional)">${esc((state[d.id]&&state[d.id].note)||"")}</textarea>`;
  list.appendChild(el);
});
list.addEventListener("input",e=>{
  const t=e.target;
  if(t.type==="radio"){state[t.name]=Object.assign(state[t.name]||{},{choice:t.value})}
  else if(t.dataset.q){state[t.dataset.q]=Object.assign(state[t.dataset.q]||{},{note:t.value})}
  save();
});
function build(){
  const lines=["Decisions on "+P.target+" (from the decision page \""+P.title+"\").","Apply each choice, update everything it touches, and keep related sections consistent. Where I asked a question, answer it and wait for me before applying that item.",""];
  let unsure=0;
  D.forEach(d=>{
    const s=state[d.id]||{};const ch=s.choice||recOf(d);const note=(s.note||"").trim();
    if(ch==="unsure"){unsure++;lines.push(`${d.id} ${d.title}: NOT SURE.`+(note?` Question: ${note}`:" (no question written)"))}
    else{const o=d.options.find(x=>x.id===ch);
      lines.push(`${d.id} ${d.title}: ${o.name} [${o.id}]`+(o.recommended?" (recommended)":" (not the recommendation)")+(note?`. Note: ${note}`:""))}
  });
  document.getElementById("count").textContent=`${D.length} decisions, ${unsure} unsure`;
  return lines.join("\n");
}
const out=document.getElementById("out"),ta=document.getElementById("prompt");
document.getElementById("gen").onclick=()=>{ta.value=build();out.style.display="block";out.scrollIntoView({behavior:"smooth"})};
document.getElementById("copy").onclick=async()=>{
  ta.value=build();out.style.display="block";
  try{await navigator.clipboard.writeText(ta.value);flash("Copied")}catch(e){ta.select();flash(document.execCommand&&document.execCommand("copy")?"Copied":"Select and copy")}
};
document.getElementById("reset").onclick=()=>{state={};save();location.reload()};
function flash(m){const b=document.getElementById("copy");const t=b.textContent;b.textContent=m;setTimeout(()=>b.textContent=t,1200)}
document.getElementById("count").textContent=`${D.length} decisions`;
</script>
</body>
</html>
