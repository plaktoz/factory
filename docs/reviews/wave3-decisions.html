<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Wave 3 owner decisions</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1c1a;--mute:#666660;--line:#dcdcd6;--accent:#2b5fd9;--accent-bg:#e8eefc;--pro:#1b7a3e;--con:#b3261e;--rec:#8a5a00;--rec-bg:#fdf1d6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ececE8;--mute:#9a9a92;--line:#34342f;--accent:#7ca3ff;--accent-bg:#1e2a4a;--pro:#5fcf8a;--con:#ff8a80;--rec:#f2c260;--rec-bg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 2px}
.tag{font-size:12px;color:var(--mute);margin:0 0 10px}
.ctx{margin:0 0 12px}
.ctx b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.opts{display:grid;gap:8px}
label.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
label.opt input{margin-right:8px}
.name{font-weight:600}
.rec{font-size:11px;font-weight:600;color:var(--rec);background:var(--rec-bg);border-radius:4px;padding:1px 6px;margin-left:6px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 0 24px;font-size:13px}
@media(max-width:560px){.pc{grid-template-columns:1fr;margin-left:0}}
.pc ul{margin:0;padding-left:16px}
.pro li::marker{color:var(--pro)} .con li::marker{color:var(--con)}
.why{font-size:13px;color:var(--mute);margin:10px 0 0}
textarea{width:100%;min-height:54px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
#out{display:none;margin-top:24px}
#out textarea{min-height:320px;font:13px/1.45 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<main>
<h1 id="h1"></h1>
<p class="sub" id="intro"></p>
<div id="list"></div>
<section id="out" class="card">
  <h2>Prompt</h2>
  <p class="tag">Copy this and paste it into the Claude Code session.</p>
  <textarea id="prompt" readonly></textarea>
</section>
</main>
<div class="bar">
  <span id="count"></span>
  <button id="gen">Generate prompt</button>
  <button id="copy" class="alt">Copy</button>
  <button id="reset" class="alt">Reset to recommended</button>
</div>
<script id="data" type="application/json">{"title": "Wave 3 owner decisions", "intro": "Waves 0 to 3 are merged except 6B. Five other items were settled without you (listed in the notes file). Three need your call.", "target": "docs/tasks.md", "storage_key": "wave3-decisions-2026-11-15", "decisions": [{"id": "D1", "title": "Draft report schemas and merge.json", "ref": "factory/schemas/*.schema.json; module 5, Draft report schemas; module 13", "context": "The spec gave no fields for stage-report, test-report, source-notes and review-findings, so wave 3 shipped drafts marked x-status: draft. merge.json (module 13) has no schema and is written as auto, reason and rules[{rule, passed, detail}]. The bug-fix gates run on these today. A finding of medium or high severity blocks, which matches review_findings_at_or_above: medium in module 13.", "options": [{"id": "accept-drafts", "name": "Accept the drafts as the phase 1 schemas", "recommended": true, "pros": ["bug-fix runs now with no change", "The shapes are the smallest the skills and gates need", "Changing a field later is a schema edit plus tests"], "cons": ["Real model output may not fit; there has been no live run", "Each draft's x-status and DRAFT text must be removed by hand"]}, {"id": "accept-after-live-run", "name": "Keep them as drafts until the first live run, then freeze", "pros": ["Fields come from real artifacts, not guesses", "No premature freeze"], "cons": ["The drafts stay unsettled during the tutorial test", "Needs a live run, which needs 6B and 16"]}, {"id": "write-merge-schema", "name": "Accept the drafts and also write a merge schema now", "pros": ["merge.json is validated like every other state file", "The dashboard can reject a bad merge.json"], "cons": ["Fixes the guessed merge.json fields into a schema before module 15 reads them for real", "More files to keep in sync with module 13"]}], "why": "The drafts are the smallest shape that makes bug-fix run, and a live run will show whether any field is wrong."}, {"id": "D2", "title": "Loop count on bug-fix verify to fix", "ref": "factory/workflows/bug-fix.yaml; module 8, rework walkthrough", "context": "max is the number of loops allowed. bug-fix ships verify->fix with max: 2, so the third failure blocks. The module 8 walkthrough and its sample feedback record say loop 1 of 3 and block on the fourth failure. The code and a test follow the shipped file.", "options": [{"id": "keep-2-fix-doc", "name": "Keep max: 2 and change the walkthrough to 2", "recommended": true, "pros": ["No behavior change", "The test pinning the shipped values stays true", "Fewer wasted worker runs before a human is asked"], "cons": ["Two tries may be too few for a flaky e2e test", "Changes a decided example in module 8"]}, {"id": "raise-to-3", "name": "Raise the shipped file to max: 3 to match the walkthrough", "pros": ["The doc and the shipped value agree", "One more chance to fix a failing verify"], "cons": ["Changes behavior you did not choose", "More worker cost on a stuck run", "Needs the pinning test updated"]}], "why": "The shipped value is the one the tests pin, and an example in a walkthrough is the easier thing to change."}, {"id": "D3", "title": "Phase 2 evals on main (PRs #39 and #40)", "ref": "AGENTS.md, Build order; phase-2.md P2-9", "context": "Another session merged two phase 2 PRs to main: #39 (docs/research/p2-9 trial, scripts/evals/reviewers) and #40 (factory/workflows/reviewer-eval.yaml, a test, an ADR). AGENTS.md says do not build phase 2 in phase 1. #40 puts reviewer-eval into the kit that gets copied to other repos, and adds a test to the engine suite.", "options": [{"id": "keep-move-out-of-kit", "name": "Keep #39, and move reviewer-eval.yaml out of the shipped kit", "recommended": true, "pros": ["Keeps the eval research and scripts", "The kit stays phase 1 only", "The kit copied into other repos has no eval workflow"], "cons": ["A follow-up PR is needed, including the test", "The other session's tests may expect the workflow in factory/workflows"]}, {"id": "keep-both", "name": "Keep both as merged", "pros": ["No work", "The eval workflow is already tested"], "cons": ["Breaks the phase 1 rule in AGENTS.md", "The eval workflow ships to every repo that runs factory init"]}, {"id": "revert-both", "name": "Revert #39 and #40", "pros": ["main is phase 1 only again", "Matches AGENTS.md exactly"], "cons": ["Loses research someone did on purpose", "Reverting a merged PR from another session needs that session's owner to agree"]}], "why": "The research and scripts are outside the kit and harmless, while a workflow in the kit reaches other repos."}]}</script>
<script>
const P=JSON.parse(document.getElementById("data").textContent), D=P.decisions;
const KEY="decision-page:"+P.storage_key;
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function recOf(d){return d.options.find(o=>o.recommended).id}
document.getElementById("h1").textContent=P.title;
document.getElementById("intro").innerHTML=esc(P.intro)+" Spec: <code>"+esc(P.target)+"</code>. Recommended options are preselected. Pick one per card, add a question if you are unsure, then press <b>Generate prompt</b> and paste it back into Claude Code.";
const list=document.getElementById("list");
D.forEach(d=>{
  const cur=(state[d.id]&&state[d.id].choice)||recOf(d);
  const el=document.createElement("section");el.className="card";
  el.innerHTML=
   `<h2>${esc(d.id)}. ${esc(d.title)}</h2><p class="tag">${esc(d.ref)}</p>`+
   `<div class="ctx"><b>Context</b>${esc(d.context)}</div>`+
   `<div class="opts">`+d.options.map(o=>
     `<label class="opt"><input type="radio" name="${esc(d.id)}" value="${esc(o.id)}" ${o.id===cur?"checked":""}>`+
     `<span class="name">${esc(o.name)}</span>${o.recommended?'<span class="rec">Recommended</span>':""}`+
     `<div class="pc"><ul class="pro">${o.pros.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul><ul class="con">${o.cons.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div></label>`).join("")+
   `<label class="opt"><input type="radio" name="${esc(d.id)}" value="unsure" ${cur==="unsure"?"checked":""}><span class="name">Not sure: I have a question</span></label></div>`+
   `<p class="why">Why recommended: ${esc(d.why)}</p>`+
   `<textarea data-q="${esc(d.id)}" placeholder="Question or note (optional)">${esc((state[d.id]&&state[d.id].note)||"")}</textarea>`;
  list.appendChild(el);
});
list.addEventListener("input",e=>{
  const t=e.target;
  if(t.type==="radio"){state[t.name]=Object.assign(state[t.name]||{},{choice:t.value})}
  else if(t.dataset.q){state[t.dataset.q]=Object.assign(state[t.dataset.q]||{},{note:t.value})}
  save();
});
function build(){
  const lines=["Decisions on "+P.target+" (from the decision page \""+P.title+"\").","Apply each choice, update everything it touches, and keep related sections consistent. Where I asked a question, answer it and wait for me before applying that item.",""];
  let unsure=0;
  D.forEach(d=>{
    const s=state[d.id]||{};const ch=s.choice||recOf(d);const note=(s.note||"").trim();
    if(ch==="unsure"){unsure++;lines.push(`${d.id} ${d.title}: NOT SURE.`+(note?` Question: ${note}`:" (no question written)"))}
    else{const o=d.options.find(x=>x.id===ch);
      lines.push(`${d.id} ${d.title}: ${o.name} [${o.id}]`+(o.recommended?" (recommended)":" (not the recommendation)")+(note?`. Note: ${note}`:""))}
  });
  document.getElementById("count").textContent=`${D.length} decisions, ${unsure} unsure`;
  return lines.join("\n");
}
const out=document.getElementById("out"),ta=document.getElementById("prompt");
document.getElementById("gen").onclick=()=>{ta.value=build();out.style.display="block";out.scrollIntoView({behavior:"smooth"})};
document.getElementById("copy").onclick=async()=>{
  ta.value=build();out.style.display="block";
  try{await navigator.clipboard.writeText(ta.value);flash("Copied")}catch(e){ta.select();flash(document.execCommand&&document.execCommand("copy")?"Copied":"Select and copy")}
};
document.getElementById("reset").onclick=()=>{state={};save();location.reload()};
function flash(m){const b=document.getElementById("copy");const t=b.textContent;b.textContent=m;setTimeout(()=>b.textContent=t,1200)}
document.getElementById("count").textContent=`${D.length} decisions`;
</script>
</body>
</html>
