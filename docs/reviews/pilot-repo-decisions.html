<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Pilot repo decisions</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1c1a;--mute:#666660;--line:#dcdcd6;--accent:#2b5fd9;--accent-bg:#e8eefc;--pro:#1b7a3e;--con:#b3261e;--rec:#8a5a00;--rec-bg:#fdf1d6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1f1c;--ink:#ececE8;--mute:#9a9a92;--line:#34342f;--accent:#7ca3ff;--accent-bg:#1e2a4a;--pro:#5fcf8a;--con:#ff8a80;--rec:#f2c260;--rec-bg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 16px}
.card h2{font-size:17px;margin:0 0 2px}
.tag{font-size:12px;color:var(--mute);margin:0 0 10px}
.ctx{margin:0 0 12px}
.ctx b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.opts{display:grid;gap:8px}
label.opt{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
label.opt input{margin-right:8px}
.name{font-weight:600}
.rec{font-size:11px;font-weight:600;color:var(--rec);background:var(--rec-bg);border-radius:4px;padding:1px 6px;margin-left:6px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 0 24px;font-size:13px}
@media(max-width:560px){.pc{grid-template-columns:1fr;margin-left:0}}
.pc ul{margin:0;padding-left:16px}
.pro li::marker{color:var(--pro)} .con li::marker{color:var(--con)}
.why{font-size:13px;color:var(--mute);margin:10px 0 0}
textarea{width:100%;min-height:54px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
#out{display:none;margin-top:24px}
#out textarea{min-height:320px;font:13px/1.45 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<main>
<h1 id="h1"></h1>
<p class="sub" id="intro"></p>
<div id="list"></div>
<section id="out" class="card">
  <h2>Prompt</h2>
  <p class="tag">Copy this and paste it into the Claude Code session.</p>
  <textarea id="prompt" readonly></textarea>
</section>
</main>
<div class="bar">
  <span id="count"></span>
  <button id="gen">Generate prompt</button>
  <button id="copy" class="alt">Copy</button>
  <button id="reset" class="alt">Reset to recommended</button>
</div>
<script id="data" type="application/json">{"title": "Pilot repo decisions", "intro": "The pilot repo (plaktoz/test-adapters) has rules the spec does not meet yet. Merge policy and the model field are settled in the notes below; these four need your call.", "target": "docs/design/phase-2.md (P2-4) and the module files it names", "storage_key": "pilot-repo-v1", "decisions": [{"id": "P1", "title": "Commits the engine makes without a request", "ref": "Module 7, checkpoint; the repo's AGENTS.md says no commit without a request", "context": "Checkpoints are WIP commits on a task branch. They also drive crash recovery (resume from the last checkpoint), note delivery (restart at a checkpoint) and the D12 reset target. The repo rule forbids committing unless asked.", "options": [{"id": "local-branch", "name": "Keep checkpoints on a local task branch that is never pushed; only the join commit is pushed", "recommended": true, "pros": ["Crash recovery and notes keep working", "Task branches are already never pushed in the spec", "The pushed history is one commit per task"], "cons": ["Still creates local commits the repo rule did not ask for", "Needs the owner to accept 'the engine commits locally' as a request"]}, {"id": "no-commits", "name": "Turn checkpoints off in this repo; snapshot with a stash or a patch file instead", "pros": ["No commit the owner did not request", "Matches the repo rule literally"], "cons": ["A new engine path to build and test for one repo", "Recovery and the D12 reset must use patches, which merge badly", "Not in phase 1a scope"]}, {"id": "ask-once", "name": "Record the owner's request once in the repo config and treat it as the request for all checkpoint commits", "pros": ["Smallest change", "Keeps the standard engine path", "The consent is written down and reviewable"], "cons": ["Interprets the repo rule loosely; the owner must agree that it counts"]}], "why": "Checkpoints carry three features, so removing them costs more than keeping them local."}, {"id": "P2", "title": "Run state and worktrees against the repo's worktree rule", "ref": "Module 17 housekeeping; repo AGENTS.md section 3", "context": "The repo says work stays in the worktree until git status is clean, and a worktree is removed only after a comparison. The engine removes task worktrees right after the join and the run worktree after merge.", "options": [{"id": "gate-cleanup", "name": "Make cleanup run the repo's comparison first and skip removal when it fails", "recommended": true, "pros": ["Follows the repo's rule", "Housekeeping already skips dirty worktrees", "Leaves a report when it skips"], "cons": ["Needs the comparison as a configurable command per repo", "Leftover worktrees pile up until someone clears them"]}, {"id": "keep-all", "name": "Never remove worktrees in this repo; the owner runs gc by hand", "pros": ["Nothing removed by surprise", "No new code"], "cons": ["Disk and branch clutter grows", "Defeats the end-of-life promise in the spec"]}], "why": "The spec already skips dirty worktrees, so one more gate is a small step."}, {"id": "P3", "title": "When the pilot starts", "ref": "docs/design/phase-2.md P2-4; phase split in the main spec", "context": "The repo's open tasks are jest feature work, which needs the 1b feature workflow. A chore or bug-fix pilot could run on phase 1a.", "options": [{"id": "1a-chore", "name": "Start in phase 1a with one chore or bug-fix issue, human merge, then move to feature work in 1b", "recommended": true, "pros": ["Real feedback on the core loop early", "Small blast radius", "Tests the repo constraints before feature work"], "cons": ["Needs a suitable chore or bug in the repo", "Pilot results arrive before the dashboard has writes"]}, {"id": "after-1b", "name": "Wait for phase 1b and start with a feature task", "pros": ["Matches the repo's real backlog", "One start, no rework of constraints"], "cons": ["No real-repo feedback for the whole of 1a", "Constraint conflicts surface late"]}], "why": "The riskiest assumptions are the repo constraints, and a chore tests them cheaply."}, {"id": "P4", "title": "Which model the engine records for this repo", "ref": "Module 9 and module 14; the gateway does not allow a chosen model", "context": "Workers must not send a model override here. The usage record still needs a model name, and the gateway reports one at run time (this session's own calls report an unrecognized model name).", "options": [{"id": "observed", "name": "Leave model unset, and store whatever the harness result reports as the observed model", "recommended": true, "pros": ["Honest record of what ran", "No override sent", "Works if the gateway changes model"], "cons": ["The name may be an alias such as an internal gateway label", "Reports group by an unstable string"]}, {"id": "label", "name": "Store a fixed label from repo config, such as 'gateway-default'", "pros": ["Stable grouping in reports", "Simple"], "cons": ["Can silently hide a real model change", "A guess recorded as a fact"]}], "why": "The usage record is for facts, so it keeps what the harness reported."}]}</script>
<script>
const P=JSON.parse(document.getElementById("data").textContent), D=P.decisions;
const KEY="decision-page:"+P.storage_key;
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function recOf(d){return d.options.find(o=>o.recommended).id}
document.getElementById("h1").textContent=P.title;
document.getElementById("intro").innerHTML=esc(P.intro)+" Spec: <code>"+esc(P.target)+"</code>. Recommended options are preselected. Pick one per card, add a question if you are unsure, then press <b>Generate prompt</b> and paste it back into Claude Code.";
const list=document.getElementById("list");
D.forEach(d=>{
  const cur=(state[d.id]&&state[d.id].choice)||recOf(d);
  const el=document.createElement("section");el.className="card";
  el.innerHTML=
   `<h2>${esc(d.id)}. ${esc(d.title)}</h2><p class="tag">${esc(d.ref)}</p>`+
   `<div class="ctx"><b>Context</b>${esc(d.context)}</div>`+
   `<div class="opts">`+d.options.map(o=>
     `<label class="opt"><input type="radio" name="${esc(d.id)}" value="${esc(o.id)}" ${o.id===cur?"checked":""}>`+
     `<span class="name">${esc(o.name)}</span>${o.recommended?'<span class="rec">Recommended</span>':""}`+
     `<div class="pc"><ul class="pro">${o.pros.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul><ul class="con">${o.cons.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div></label>`).join("")+
   `<label class="opt"><input type="radio" name="${esc(d.id)}" value="unsure" ${cur==="unsure"?"checked":""}><span class="name">Not sure: I have a question</span></label></div>`+
   `<p class="why">Why recommended: ${esc(d.why)}</p>`+
   `<textarea data-q="${esc(d.id)}" placeholder="Question or note (optional)">${esc((state[d.id]&&state[d.id].note)||"")}</textarea>`;
  list.appendChild(el);
});
list.addEventListener("input",e=>{
  const t=e.target;
  if(t.type==="radio"){state[t.name]=Object.assign(state[t.name]||{},{choice:t.value})}
  else if(t.dataset.q){state[t.dataset.q]=Object.assign(state[t.dataset.q]||{},{note:t.value})}
  save();
});
function build(){
  const lines=["Decisions on "+P.target+" (from the decision page \""+P.title+"\").","Apply each choice, update everything it touches, and keep related sections consistent. Where I asked a question, answer it and wait for me before applying that item.",""];
  let unsure=0;
  D.forEach(d=>{
    const s=state[d.id]||{};const ch=s.choice||recOf(d);const note=(s.note||"").trim();
    if(ch==="unsure"){unsure++;lines.push(`${d.id} ${d.title}: NOT SURE.`+(note?` Question: ${note}`:" (no question written)"))}
    else{const o=d.options.find(x=>x.id===ch);
      lines.push(`${d.id} ${d.title}: ${o.name} [${o.id}]`+(o.recommended?" (recommended)":" (not the recommendation)")+(note?`. Note: ${note}`:""))}
  });
  document.getElementById("count").textContent=`${D.length} decisions, ${unsure} unsure`;
  return lines.join("\n");
}
const out=document.getElementById("out"),ta=document.getElementById("prompt");
document.getElementById("gen").onclick=()=>{ta.value=build();out.style.display="block";out.scrollIntoView({behavior:"smooth"})};
document.getElementById("copy").onclick=async()=>{
  ta.value=build();out.style.display="block";
  try{await navigator.clipboard.writeText(ta.value);flash("Copied")}catch(e){ta.select();flash(document.execCommand&&document.execCommand("copy")?"Copied":"Select and copy")}
};
document.getElementById("reset").onclick=()=>{state={};save();location.reload()};
function flash(m){const b=document.getElementById("copy");const t=b.textContent;b.textContent=m;setTimeout(()=>b.textContent=t,1200)}
document.getElementById("count").textContent=`${D.length} decisions`;
</script>
</body>
</html>
